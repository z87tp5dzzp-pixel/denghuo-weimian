<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>燈火未眠</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="燈火未眠">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=1793040782">
</head>
<body>
<div id="frame"><div id="safe"></div>
<div id="game">
  <div id="stage">
    <div id="bg" class="bg"></div><div id="bg2" class="bg"></div>
    <div id="sprites"></div>
    <div id="cg"></div>
    <div id="rain"></div>
    <div id="fxlayer"></div>
  </div>
  <div id="hud" class="hidden">
    <div id="status"><div id="colorbar"></div><div class="gauge" id="g-load"><span>負荷</span><i></i></div><div class="gauge" id="g-loc"><span>失控</span><i></i></div></div>
    <div id="datechip"></div>
    <div id="counter"></div>
  </div>
  <div id="window" class="hidden">
    <div id="namebox"><span id="who"></span></div>
    <div id="text"></div>
    <div id="ctc">▼</div>
  </div>
  <div id="choices" class="hidden"><div id="cprompt"></div><div id="clist"></div><div id="ctimer"><i></i></div></div>
  <div id="card" class="hidden"><div class="c1"></div><div class="c2"></div></div>
  <div id="quick" class="hidden"></div>

  <div id="mainmenu">
    <div class="mm-sky"></div><div class="mm-glow"></div>
    <div class="mm-nav nav" id="mm-nav"></div>
    <div class="mm-logo"><div class="l1">在沒有顏色的世界裡</div><div class="l2">燈火未眠</div><div class="l3">— 有人替她點燈 —</div></div>
    <div class="mm-ver" id="mm-ver"></div>
  </div>

  <div id="gmenu" class="hidden">
    <div class="gm-bg"></div>
    <div class="gm-navframe"></div>
    <div class="gm-title" id="gm-title"></div>
    <div class="gm-nav nav" id="gm-nav"></div>
    <div class="gm-content" id="gm-content"></div>
    <button class="gm-return" id="gm-return">返回</button>
  </div>

  <div id="pick" class="hidden"><div class="pk-prompt">要觀看序章嗎？</div><div class="pk-list"><button data-p="watch">觀看序章</button><button data-p="skip">跳過序章</button></div><div class="pk-note">跳過時，序章的選項以預設處理，直接從共通線開始。</div><button class="pk-back" data-p="back">返回</button></div>

  <div id="viewer" class="hidden"></div>
  <div id="confirm" class="hidden"><div class="cf-box"><div class="cf-msg" id="cf-msg"></div><div class="cf-btns"><button id="cf-yes">是</button><button id="cf-no">否</button></div></div></div>
  <div id="notify"></div>
  <div id="boot">燈火未眠<small>載入中……</small></div>
</div>
<div id="rotate">將手機橫放，畫面會更大</div>
</div>
<script src="js/expr.js?v=1793040782"></script>
<script src="js/engine.js?v=1793040782"></script>
<script src="js/ui.js?v=1793040782"></script>
</body>
</html>
